include:
  - project: eiseron/stack/ci
    file: /lock.yml
    ref: v0.9.23
  - project: eiseron/stack/ci
    file: /templates/phoenix.yml
    ref: v0.9.23
    inputs:
      app_name: afinados
  - project: eiseron/stack/ci
    file: /templates/preview-app.yml
    ref: v0.9.23
    inputs:
      app_name: afinados
      mix_env: preview
  - project: eiseron/stack/ci
    file: /templates/publish-docs.yml
    ref: v0.1.10
    inputs:
      site_repo: eiseron/afinados/afinados-site
      locale_map: '{"pt_BR":"src/docs","en":"src/en/docs"}'
  - project: eiseron/stack/ci
    file: /templates/release.yml
    ref: v0.1.17
    inputs:
      automation_ref: v0.5.3
  - project: eiseron/stack/ci
    file: /templates/prod-build.yml
    ref: v0.1.29
    inputs:
      app_name: afinados
      assets_bucket: afinados-assets
      sourcemaps_bucket: afinados-sourcemaps
  - project: eiseron/stack/ci
    file: /templates/coverage-gate.yml
    ref: v0.9.23

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - lint
  - test
  - build
  - upload
  - deploy
  - preview
  - publish
  - release
